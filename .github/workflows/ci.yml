name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r test-requirements.txt

      - name: Download verified integration-test model
        run: python scripts/download_models.py --model u2netp

      - name: Compile source
        run: python -m compileall -q main.py image_tool scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic alpha quality gate
        run: >-
          python -m image_tool.quality
          --manifest quality_dataset/starter/manifest.json
          --predictions quality_results/starter-u2netp
          --run-model u2netp
          --output quality_results/starter-u2netp.json
